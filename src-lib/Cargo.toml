[package]
name = "nslnotes-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
notify = "6"
notify-debouncer-mini = "0.4"
base64 = "0.22"
dirs = "5"
tar = "0.4"
flate2 = "1"
walkdir = "2"
pavao = { version = "0.2", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }

[features]
# Enable SMB backend support (requires libsmbclient at build and runtime).
# Credential encryption at rest is always on when this feature is enabled.
# Web server builds with this on; the Tauri desktop build leaves it off so
# Linux/macOS/Windows developers don't need libsmbclient installed.
smb = ["dep:pavao", "dep:chacha20poly1305", "dep:argon2", "dep:rand"]

[dev-dependencies]
tempfile = "3"
